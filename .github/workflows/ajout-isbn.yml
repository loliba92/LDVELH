name: Ajouter des livres (ISBN)

# Lancé depuis la page « Vérifier les prix » (bouton « Ajouter maintenant ») ou, à la main : Actions > Run workflow > coller la liste.
on:
  workflow_dispatch:
    inputs:
      liste:
        description: "ISBN, un par ligne (facultatif après l'ISBN, séparés par ; : série ; numéro ; titre)"
        required: true
        type: string
      releve:
        description: "Relever ensuite le prix du neuf et les annonces (oui/non)"
        required: false
        default: "oui"

permissions:
  contents: write
  actions: write

# File d'attente à part du relevé eBay (une demi-heure) : un envoi du site ne reste plus bloqué derrière lui, ni annulé en silence quand un
# autre arrive. Les écritures simultanées sont sans risque : .github/scripts/publier.sh reprend depuis la dernière version si main a avancé.
concurrency:
  group: ecriture-donnees
  cancel-in-progress: false

jobs:
  ajout:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LISTE: ${{ inputs.liste }}
      RELEVE: ${{ inputs.releve }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Tests
        run: python pipeline/test_importer_isbn.py
      - name: Ajouter les livres
        run: |
          printf '%s\n' "$LISTE" > liste-isbn.txt
          python pipeline/importer_isbn.py liste-isbn.txt | tee -a "$GITHUB_STEP_SUMMARY"
          rm liste-isbn.txt
      - name: Jaquettes des livres ajoutés
        # Avant, les livres ajoutés ici n'avaient pas de jaquette (17 octobre 2026) : elle est cherchée sur la fiche de leslibraires.fr
        # (une image en relief est écartée, voir scrapers/jaquettes_librairie.py). Un échec ici n'empêche pas l'ajout.
        run: |
          python scrapers/jaquettes_librairie.py | tee -a "$GITHUB_STEP_SUMMARY" || echo "Jaquettes non récupérées (erreur ignorée)."
      - name: Base et données du site
        run: |
          python pipeline/build_db.py
          python pipeline/export_site.py
          python pipeline/construire_pages.py
      - name: Enregistrer et republier
        run: |
          git config user.name "ajout-isbn"
          git config user.email "ajout-isbn@users.noreply.github.com"
          AVANT="$(git rev-parse HEAD)"
          # Si main a avancé pendant le lot, on repart de sa dernière version et on rejoue l'ajout (voir .github/scripts/publier.sh)
          REJOUER='printf "%s\n" "$LISTE" > liste-isbn.txt; python pipeline/importer_isbn.py liste-isbn.txt; rm liste-isbn.txt; python scrapers/jaquettes_librairie.py || true; python pipeline/build_db.py && python pipeline/export_site.py && python pipeline/construire_pages.py' \
            .github/scripts/publier.sh "Livres ajoutés par liste d'ISBN du $(date +%F)" data/processed/editions.csv web/covers web/data web/revue-prix.html web/evolutions.html
          [ "$(git rev-parse HEAD)" != "$AVANT" ] || exit 0
          gh workflow run pages.yml
          if [ "$RELEVE" != "non" ]; then gh workflow run prix-ebay.yml; fi
