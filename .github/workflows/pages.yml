name: Publier le site

# Publie le dossier web/ sur GitHub Pages à chaque envoi sur main.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/manual/guide-jeton.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler le service worker et les pages gardées
        run: |
          test "$(wc -c < web/sw.js)" -gt 500 || { echo "web/sw.js est vide ou tronqué : publication refusée"; exit 1; }
          grep -q "const VERSION = 'cdh-v" web/sw.js || { echo "web/sw.js sans numéro de version : publication refusée"; exit 1; }
          grep -q 'id="an-nav"' web/butin.html || { echo "web/butin.html sans les sous-onglets de l'Analyse : publication refusée"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer la sortie de publication
        run: |
          mkdir _site
          cp -r web/. _site/
      # Guide de référence en PDF, non listé : généré une fois par jour par guide-pdf.yml ; ici on se contente de le joindre à la sortie de publication (jamais dans un commit).
      # Sans guide récent, la publication continue sans lui et le bouton reste caché. Le nom du fichier porte le jeton de data/manual/guide-jeton.txt.
      - name: Joindre le guide de référence (PDF)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/joindre-guide.sh _site data/manual/guide-jeton.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
