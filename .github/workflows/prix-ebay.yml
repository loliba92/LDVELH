name: Relevé des prix actuels (eBay)

# Chaque lundi, ou à la demande : interroge l'interface officielle d'eBay, ajoute un relevé agrégé,
# reconstruit la base, regénère les données du site et redéclenche sa publication.
# Prérequis : secrets EBAY_CLIENT_ID et EBAY_CLIENT_SECRET (voir docs/PRIX-ACTUELS.md).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre maximal d'éditions interrogées (vide = toutes ; 20 pour un essai)"
        required: false
      controle:
        description: "Contrôle SANS enregistrement sur N éditions (comptages seulement) : vérifie le rattachement aux éditions"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: prix-ebay
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Vérifier les identifiants
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "Secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET absents : voir docs/PRIX-ACTUELS.md" >&2
            exit 1
          fi
      - name: Tests
        run: |
          python pipeline/test_estimation.py
          python pipeline/test_calibration.py
          python pipeline/test_add_prix.py
          python scrapers/test_ebay_api.py
      - name: Contrôle (sans enregistrement)
        if: ${{ inputs.controle != '' }}
        run: python scrapers/ebay_api.py --controle ${{ inputs.controle }}
      - name: Relevé eBay
        if: ${{ inputs.controle == '' }}
        run: python scrapers/ebay_api.py ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }}
      - name: Base et données du site
        if: ${{ inputs.controle == '' }}
        run: |
          python pipeline/build_db.py
          python pipeline/export_site.py
      - name: Enregistrer et republier
        if: ${{ inputs.controle == '' }}
        run: |
          git config user.name "releve-prix"
          git config user.email "releve-prix@users.noreply.github.com"
          git add data/raw/occasion data/processed/calibration.json web/data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Relevé des prix actuels du $(date +%F)"
          git push
          gh workflow run pages.yml
