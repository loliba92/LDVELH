name: Relevé des prix (eBay et librairies)

# UN SEUL lot pour tous les prix, tous les deux jours ou à la demande : (1) interroge l'interface officielle d'eBay (annonces d'occasion), (2) relève le prix du
# neuf chez les libraires (pipeline/prix_neuf.py) seulement si le dernier relevé complet date d'au moins 7 jours (jamais plus d'une fois par semaine ; environ tous les 8 jours avec un relevé eBay tous les deux jours), et à la demande ; entre deux, relevé léger des seuls exemplaires d'occasion des librairies (programme présenté comme une
# lecture hebdomadaire, réseau de petites librairies : on ne le sollicite pas plus), puis ajoute un relevé agrégé, reconstruit la base, regénère les
# données du site et redéclenche sa publication. Le relevé eBay a lieu tous les deux jours : le prix évolue par petites étapes (lissage, voir
# docs/MODELE-PRICING.md) au lieu de grands sauts après une semaine de données (environ 2 400 appels par relevé, pour une limite habituelle de
# 5 000 par jour : éviter deux relevés complets le même jour). « */2 » = les jours impairs du mois : en fin de mois, le 31 puis le 1er sont consécutifs.
# Prérequis : secrets EBAY_CLIENT_ID et EBAY_CLIENT_SECRET (voir docs/PRIX-ACTUELS.md).
on:
  schedule:
    - cron: "17 5 */2 * *"      # tous les deux jours, à 5 h 17 (Greenwich)
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre maximal d'éditions interrogées (vide = toutes ; 20 pour un essai)"
        required: false
      controle:
        description: "Contrôle SANS enregistrement sur N éditions (comptages seulement) : vérifie le rattachement aux éditions"
        required: false
      diagnostic:
        description: "ISBN : liste les annonces trouvées avec leur lien dans le journal (aucun enregistrement)"
        required: false
      essai_photos:
        description: "Essai de la comparaison de photos sur de vraies annonces (SANS enregistrement) : nombre d'éditions tirées au hasard (200 conseillé)"
        required: false
      essais:
        description: "Compare plusieurs façons de chercher (ISBN-13, ISBN-10, titre…) sur N éditions, comptages seulement (60 conseillé)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: prix-ebay
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow opencv-python-headless
      - name: Vérifier les identifiants
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "Secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET absents : voir docs/PRIX-ACTUELS.md" >&2
            exit 1
          fi
      - name: Tests
        run: |
          python pipeline/test_estimation.py
          python pipeline/test_calibration.py
          python pipeline/test_mouvements.py
          python pipeline/test_add_prix.py
          python pipeline/test_validations.py
          python pipeline/test_prix_neuf.py
          python pipeline/test_prix_editeur.py
          python scrapers/test_ebay_api.py
          python scrapers/test_reconciliation_image.py
          python scrapers/test_essai_photos.py
      - name: Contrôle (sans enregistrement)
        if: ${{ inputs.controle != '' }}
        run: python scrapers/ebay_api.py --controle ${{ inputs.controle }}
      - name: Diagnostic d'une édition
        if: ${{ inputs.diagnostic != '' }}
        run: python scrapers/ebay_api.py --diagnostic "${{ inputs.diagnostic }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Essai de la comparaison de photos (sans enregistrement)
        if: ${{ inputs.essai_photos != '' }}
        run: python scrapers/ebay_api.py --essai-photos ${{ inputs.essai_photos }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Essai de requêtes (sans enregistrement)
        if: ${{ inputs.essais != '' }}
        run: python scrapers/ebay_api.py --essais ${{ inputs.essais }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Relevé eBay
        if: ${{ inputs.controle == '' && inputs.diagnostic == '' && inputs.essais == '' && inputs.essai_photos == '' }}
        run: python scrapers/ebay_api.py ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }}
      - name: Prix du neuf et disponibilité des éditions en vente
        if: ${{ inputs.controle == '' && inputs.diagnostic == '' && inputs.essais == '' && inputs.essai_photos == '' }}
        continue-on-error: true
        run: |
          # Relevé complet des fiches de leslibraires.fr (prix du neuf + exemplaires d'occasion) : au plus une fois par semaine (7 jours minimum) sur l'horaire,
          # toujours à la demande. Les autres jours de l'horaire : relevé LÉGER, qui ne relit que les éditions ayant un exemplaire d'occasion en librairie
          # (une soixantaine de fiches, environ 2 minutes), pour que ces cotes d'occasion suivent le rythme d'eBay (tous les deux jours).
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/processed/prix_neuf.csv ]; then
            # date la plus ANCIENNE du fichier = dernier relevé complet : le relevé léger ne rafraîchit que les lignes des exemplaires d'occasion
            derniere="$(python -c "import csv; print(min((r['date'] for r in csv.DictReader(open('data/processed/prix_neuf.csv', encoding='utf-8')) if r.get('date')), default=''))")"
            if [ -n "$derniere" ]; then
              age=$(( ( $(date +%s) - $(date -d "$derniere" +%s) ) / 86400 ))
              if [ "$age" -lt 7 ]; then
                echo "Relevé complet fait le $derniere (il y a $age jour(s)) : relevé léger des exemplaires d'occasion seulement."
                python pipeline/prix_neuf.py --occasion
                exit 0
              fi
            fi
          fi
          python pipeline/prix_neuf.py
      - name: Base et données du site
        if: ${{ inputs.controle == '' && inputs.diagnostic == '' && inputs.essais == '' && inputs.essai_photos == '' }}
        run: |
          python pipeline/build_db.py
          python pipeline/export_site.py
          python pipeline/construire_pages.py
      - name: Enregistrer et republier
        if: ${{ inputs.controle == '' && inputs.diagnostic == '' && inputs.essais == '' && inputs.essai_photos == '' }}
        run: |
          git config user.name "releve-prix"
          git config user.email "releve-prix@users.noreply.github.com"
          AVANT="$(git rev-parse HEAD)"
          # Si main a avancé pendant le relevé (une demi-heure), on repart de sa dernière version, on y remet les fichiers du relevé et on reconstruit
          # le site (voir .github/scripts/publier.sh)
          REJOUER='git checkout "$MON_COMMIT" -- data/raw/occasion data/processed/prix_neuf.csv data/processed/calibration.json && python pipeline/build_db.py && python pipeline/export_site.py && python pipeline/construire_pages.py' \
            .github/scripts/publier.sh "Relevé des prix actuels du $(date +%F)" data/raw/occasion data/processed/prix_neuf.csv data/processed/calibration.json data/processed/cotes-historique.json web/data data/processed/annonces.json data/processed/butin.json web/evolutions.html web/revue-prix.html
          [ "$(git rev-parse HEAD)" != "$AVANT" ] || exit 0
          gh workflow run pages.yml
