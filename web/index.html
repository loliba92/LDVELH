<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cote des livres-jeux</title>
<meta name="description" content="Consultez les livres dont vous êtes le héros par série, version ou année, avec la moyenne des prix du filtre choisi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237a1f3d'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z' fill='%23d9b45f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="entete">
  <div class="conteneur">
    <p class="surtitre">Livres dont vous êtes le héros</p>
    <h1>Cote des livres-jeux</h1>
    <p class="chapeau">Choisissez une série, une version ou une période : le prix affiché est la <strong>moyenne</strong> des livres sélectionnés.</p>
  </div>
</header>

<main class="conteneur">

  <section class="carte" aria-labelledby="titre-filtres">
    <div class="carte-tete">
      <h2 id="titre-filtres">Filtres <span id="nb-filtres" class="compte"></span></h2>
      <div class="actions">
        <button type="button" class="lien bascule" id="bascule" aria-expanded="true" aria-controls="filtres">Masquer</button>
        <button type="button" class="lien" id="reinit">Tout réinitialiser</button>
      </div>
    </div>
    <p class="resume" id="resume" hidden></p>
    <div class="filtres" id="filtres">
      <div class="champ champ-large">
        <label for="f-q">Recherche</label>
        <input type="search" id="f-q" placeholder="Titre, auteur, ISBN…" autocomplete="off">
      </div>
      <div class="champ">
        <label for="f-serie">Série</label>
        <select id="f-serie"></select>
      </div>
      <div class="champ">
        <label for="f-ed">Éditeur</label>
        <select id="f-ed"></select>
      </div>
      <div class="champ champ-annees">
        <label for="f-amin">Année d'édition</label>
        <div class="deux">
          <select id="f-amin" aria-label="Année de début"></select>
          <span aria-hidden="true">à</span>
          <select id="f-amax" aria-label="Année de fin"></select>
        </div>
      </div>
      <div class="champ champ-large" role="group" aria-labelledby="lib-versions">
        <span class="etiquette" id="lib-versions">Version</span>
        <div class="puces" id="f-versions"></div>
      </div>
      <div class="champ champ-case">
        <label class="case"><input type="checkbox" id="f-vente"> Encore en vente seulement</label>
      </div>
    </div>
  </section>

  <section aria-labelledby="titre-moyenne">
    <h2 id="titre-moyenne" class="titre-section">Moyenne du filtre <span id="compte" class="compte"></span></h2>
    <p class="alerte" id="alerte" role="note" hidden></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="carte" aria-labelledby="titre-resultats">
    <div class="carte-tete carte-tete-resultats">
      <h2 id="titre-resultats">Résultats</h2>
      <div class="outils">
        <div class="champ champ-inline">
          <label for="f-groupe">Regrouper par</label>
          <select id="f-groupe">
            <option value="liste">Aucun (liste des livres)</option>
            <option value="serie">Série</option>
            <option value="version">Version</option>
            <option value="annee">Année</option>
            <option value="decennie">Décennie</option>
            <option value="editeur">Éditeur</option>
          </select>
        </div>
        <div class="champ champ-inline" id="bloc-tri">
          <label for="f-tri">Trier par</label>
          <select id="f-tri">
            <option value="serie">Série et numéro</option>
            <option value="titre">Titre</option>
            <option value="annee">Année</option>
            <option value="bon-desc">Prix en bon état, décroissant</option>
            <option value="bon-asc">Prix en bon état, croissant</option>
          </select>
        </div>
      </div>
    </div>
    <div id="resultats"></div>
  </section>

</main>

<footer class="pied">
  <div class="conteneur" id="pied"></div>
</footer>

<dialog id="fiche" aria-labelledby="fiche-titre">
  <div class="fiche-contenu" id="fiche-contenu"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
